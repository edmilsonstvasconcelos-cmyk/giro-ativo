# Supabase CLI — Configuração local para desenvolvimento
# Documentação: https://supabase.com/docs/reference/cli/config
# Para iniciar: npx supabase start
# Para aplicar migrations: npx supabase db push
# Para gerar tipos: npx supabase gen types typescript --local > types/supabase.ts

project_id = "giro-ativo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 900           # 15 minutos (spec segurança v1.0)
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600           # 10 minutos (spec segurança v1.0)

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
max_frequency = "5s"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = false    # habilitar ao implementar Sign in with Apple (Sprint 3)
client_id = ""
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[analytics]
enabled = false
port = 54327
backend = "postgres"
